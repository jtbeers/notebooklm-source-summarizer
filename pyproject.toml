[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-source-summarizer"
version = "0.1.0"
description = "Summarize sources and deeply decompose concatenated PDF documents in Google NotebookLM notebooks."
readme = "README.md"
authors = [
    { name = "Hans Beers", email = "hans.beers@kyndryl.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "notebooklm-mcp-cli>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
]
keywords = [
    "notebooklm",
    "gemini",
    "pdf-decomposition",
    "summarizer",
    "cli",
    "research",
    "document-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
notebooklm-source-summarizer = "notebooklm_source_summarizer.cli:main"
nlm-summarize = "notebooklm_source_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notebooklm_source_summarizer*"]
